<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopSpot Soccer Academy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{--red:#e50914;--grey:#1b1b1b;--lg:#ccc}
body{font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff;line-height:1.6}
.container{width:90%;max-width:1200px;margin:auto}
h1,h2,h3{line-height:1.2}
h2{font-size:36px;margin-bottom:20px}
h2 span{color:var(--red)}
section{padding:80px 0;scroll-margin-top:80px;text-align:center}
header{background:#000;padding:14px 0;position:sticky;top:0;z-index:1000;border-bottom:2px solid var(--red)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:bold;color:#fff;text-decoration:none;white-space:nowrap}
.logo img{height:44px;width:auto;max-width:260px;object-fit:contain}
.logo span{color:var(--red)}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:18px}
nav a{color:#fff;text-decoration:none;font-size:14px}
nav a:hover{color:var(--red)}
nav .nr{background:var(--red);padding:10px 16px;border-radius:5px}
nav .nr:hover{color:#fff;opacity:.85}
.hero{min-height:600px;display:flex;align-items:center;background:linear-gradient(135deg,#000,#1a0000,#0b0b0b);border-bottom:4px solid var(--red)}
.hero-content{max-width:850px;margin:auto;padding:40px 20px}
.hero h1{font-size:clamp(36px,7vw,60px);font-weight:900;margin-bottom:25px;text-transform:uppercase}
.hero h1 span{color:var(--red)}
.hero p{font-size:20px;color:var(--lg);margin-bottom:35px}
.btn{display:inline-block;background:var(--red);color:#fff;padding:14px 28px;text-decoration:none;border-radius:5px;font-weight:bold;border:2px solid var(--red);cursor:pointer;font-size:16px;transition:.3s}
.btn:hover{background:transparent;color:var(--red)}
.btn-o{background:transparent;border-color:#fff;margin:5px}
.btn-o:hover{background:#fff;color:#000}
.hl{background:var(--red);padding:35px 0}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px}
.hl h3{font-size:24px;margin-bottom:8px}
.about{background:#111}
.about p{max-width:900px;margin:0 auto 18px;color:var(--lg);font-size:17px}
.programs,.gallery,.contact{background:#080808}
.values,.ach{background:#111}
.register{background:#151515}
.intro{max-width:700px;margin:0 auto 40px;color:var(--lg)}
.grid{display:grid;gap:20px}
.pg{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.vg,.ag{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--grey);padding:30px 20px;border-radius:8px;border-bottom:4px solid var(--red)}
.card h3{color:var(--red);margin-bottom:12px;font-size:21px}
.card p{color:var(--lg);font-size:15px;margin-bottom:8px}
.card .meta{color:#fff}
.card .price{color:#fff;font-weight:bold;font-size:20px;margin-top:12px}
.card .ic{font-size:42px;margin-bottom:12px}
.card .aimg.contain{object-fit:contain;background:#000}
.card .cbtn{margin-top:12px;padding:10px 20px;font-size:14px}
.card .aimg{width:100%;height:190px;object-fit:cover;border-radius:6px;margin-bottom:14px;display:block}
.vc{padding:25px}
.vc h3{color:var(--red);font-size:24px;margin-bottom:12px}
.vc p{color:var(--lg)}
.gg{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gi{border:2px solid var(--red);border-radius:8px;overflow:hidden;background:var(--grey)}
.gi img{width:100%;height:230px;object-fit:cover;display:block}
.ci{font-size:18px}
.ci p{margin:12px 0;color:var(--lg)}
.ci a{color:var(--red);text-decoration:none;font-weight:bold}
.cb{margin-top:30px}
form.reg{max-width:700px;margin:35px auto 0;text-align:left;background:#080808;padding:35px;border-radius:8px;border-top:4px solid var(--red)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:20px}
.fg .full{grid-column:1/-1}
.reg label{display:block;margin-bottom:8px;font-weight:bold}
.reg input,.reg select,.reg textarea{width:100%;padding:12px;border:1px solid #444;background:var(--grey);color:#fff;border-radius:5px;font-size:15px;font-family:inherit}
.reg input:focus,.reg select:focus,.reg textarea:focus{outline:none;border-color:var(--red)}
.reg textarea{min-height:90px;resize:vertical}
.note{color:#aaa;font-size:13px;margin-top:15px}
footer{background:#000;padding:25px 0;text-align:center;border-top:2px solid var(--red);color:#aaa;font-size:14px}
footer span,footer a{color:var(--red)}
footer a{cursor:pointer;font-size:12px;text-decoration:none}
@media(max-width:768px){section{padding:60px 0}h2{font-size:30px}.navbar{justify-content:center}nav{justify-content:center;gap:12px}form.reg{padding:25px 20px}}

/* MANAGER PANEL */
#admin{display:none;position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;color:#111;z-index:3000;overflow:auto;padding:16px;box-shadow:-4px 0 20px rgba(0,0,0,.5);font-size:14px;text-align:left}
#admin.open{display:block}
#admin h3{font-size:20px;margin-bottom:6px;color:#111}
#admin .hint{background:#fff6d6;border:1px solid #e6d27a;padding:10px;border-radius:6px;margin:10px 0;font-size:13px}
#admin .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
#admin .tabs button{padding:7px 10px;border:1px solid #bbb;background:#f3f3f3;border-radius:5px;cursor:pointer;font-size:13px}
#admin .tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
#admin label{display:block;margin:10px 0 4px;font-weight:bold;font-size:13px}
#admin input:not([type=file]):not([type=color]):not([type=range]),#admin textarea,#admin select{width:100%;padding:8px;border:1px solid #bbb;border-radius:5px;font:inherit;background:#fff;color:#111}
#admin input[type=range]{width:100%}
#admin input[type=color]{width:70px;height:36px}
#admin .it{border:1px solid #ccc;border-radius:6px;padding:10px;margin:10px 0;background:#fafafa}
#admin .it b{margin-right:8px}
#admin button.a{padding:7px 12px;border:0;border-radius:5px;background:#222;color:#fff;cursor:pointer;margin:6px 6px 0 0;font-size:13px}
#admin button.d{background:#b00020}
#admin button.p{background:#0a7a32}
#admin .ph{display:inline-block;position:relative;margin:4px}
#admin .ph img{width:90px;height:70px;object-fit:cover;border-radius:4px;display:block}
#admin .ph button{position:absolute;top:2px;right:2px;background:#b00020;color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
#admin .it img.ai{width:100%;max-height:120px;object-fit:cover;border-radius:4px;margin:6px 0;display:block}
#admin .lp{max-height:60px;background:#000;padding:6px;border-radius:4px;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="admin"></div>
<script id="cfg" type="application/json">{}</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let x=5381;for(const c of s)x=((x*33)^c.charCodeAt(0))>>>0;return String(x)};

/* ---------- DEFAULT CONTENT (edit via Manager panel, no coding needed) ---------- */
const D={
name:'TopSpot Soccer Academy',logo:'',logoMode:'text',logoH:44,logoA:'TOP',logoB:'SPOT',logoC:'SOCCER',color:'#e50914',
h1a:'Developing Talent.',h1b:'Building Champions.',
heroText:'Welcome to TopSpot Soccer Academy — where passion meets discipline, talent is nurtured, and champions are developed.',
about:"TopSpot Soccer Academy is committed to nurturing young football talent and developing well-rounded players through structured training, discipline, teamwork, and a passion for the game.\n\nOur goal is to create an environment where every player has the opportunity to learn, grow, improve, and reach their full potential both on and off the pitch.\n\nWe believe that football is more than just a game. It is a platform for building character, confidence, leadership, and lifelong values.",
programs:[
{ages:'U7 – U9',name:'Foundation',desc:'Introduction to football, basic ball control, coordination, confidence, and fun.',sessions:'Sat 9:00 – 10:30 AM',price:'KES 2,500 / month'},
{ages:'U10 – U12',name:'Development',desc:'Technical improvement, passing, dribbling, teamwork, and understanding the game.',sessions:'Sat 10:30 AM – 12:30 PM',price:'KES 3,000 / month'},
{ages:'U13 – U15',name:'Performance',desc:'Tactical awareness, physical development, competitive match preparation, and discipline.',sessions:'Tue & Thu 4:30 – 6:00 PM',price:'KES 3,500 / month'},
{ages:'U16 – U19',name:'Elite Pathway',desc:'Advanced training, competitive exposure, leadership, and preparation for higher levels.',sessions:'Tue & Thu 6:00 – 7:30 PM',price:'KES 4,000 / month'}],
values:[
{title:'Discipline',text:'We instil respect, commitment, responsibility, and dedication in every player.'},
{title:'Teamwork',text:'We believe success comes through unity, cooperation, and supporting one another.'},
{title:'Excellence',text:'We encourage every player to strive for continuous improvement and give their best every day.'}],
gallery:[],heroImg:'',heroDim:60,
achNav:'Achievements',achShow:'yes',achA:'Our',achB:'Achievements',achIntro:'Celebrating our milestones, progress, and success.',
achievements:[
{icon:'🏆',title:'Tournament Success',text:'Celebrating competitive performances, tournament participation, and victories.'},
{icon:'⚽',title:'Player Development',text:'Supporting players in improving their skills and progressing to higher levels.'},
{icon:'🥇',title:'Individual Excellence',text:'Recognising outstanding talent, discipline, leadership, and dedication.'}],
location:'Kahawa Sukari, Nairobi',phone:'0795469246',wa:'254795469246',
pw:hash('topspot123')
};
const NEW={programs:{ages:'U? – U?',name:'New program',desc:'',sessions:'',price:''},values:{title:'New value',text:''},achievements:{mode:'photo',icon:'',img:'',fit:'cover',title:'New card',text:'',btn:'',link:''}};

let baked={},loc={};
try{baked=JSON.parse($('#cfg').textContent||'{}')}catch(e){}
try{loc=JSON.parse(localStorage.getItem('topspot_site')||'{}')}catch(e){}
let C=Object.assign({},D,baked,loc);

/* ---------- LOGO ----------
   logoMode: 'text'  = text only
             'image' = picture only (any image: PNG/JPG/SVG/GIF/WebP, emblem, badge, wordmark)
             'both'  = picture + text
   Old saved sites that already had a picture keep showing picture + text. */
function logoHTML(){
const hasImg=!!C.logo;
let mode=C.logoMode||'text';
if(!hasImg&&mode!=='text')mode='text';
const h=Math.max(20,Math.min(140,+C.logoH||44));
const img=hasImg?`<img src="${C.logo}" alt="${esc(C.name)} logo" style="height:${h}px">`:'';
const txt=`<div>${esc(C.logoA)}<span>${esc(C.logoB)}</span> ${esc(C.logoC)}</div>`;
return mode==='image'?img:mode==='both'?img+txt:txt;
}

/* ---------- PUBLIC SITE ---------- */
function render(){
document.documentElement.style.setProperty('--red',C.color);
document.title=C.name;
const paras=C.about.split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('');
const prog=C.programs.map(p=>`<div class="card"><h3>${esc(p.ages)}</h3><p><strong>${esc(p.name)}</strong></p><p>${esc(p.desc)}</p>${p.sessions?`<p class="meta">🗓 ${esc(p.sessions)}</p>`:''}${p.price?`<div class="price">${esc(p.price)}</div>`:''}</div>`).join('');
const vals=C.values.map(v=>`<div class="vc"><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p></div>`).join('');
const safeLink=u=>/^(https?:|tel:|mailto:|#)/i.test(u||'')?u:(/^[\w.-]+\.[a-z]{2,}/i.test(u||'')?'https://'+u:'');
const ach=C.achievements.map(a=>{
const mode=a.mode||(a.img?'photo':'symbol');
const media=mode==='photo'&&a.img?`<img class="aimg${a.fit==='contain'?' contain':''}" src="${a.img}" alt="${esc(a.title)}" loading="lazy">`:mode==='symbol'&&a.icon?`<div class="ic">${esc(a.icon)}</div>`:'';
const href=safeLink(a.link);
const btn=a.link&&href?`<a class="btn cbtn" href="${esc(href)}"${/^https?:/i.test(href)?' target="_blank" rel="noopener noreferrer"':''}>${esc(a.btn||'Learn more')}</a>`:'';
return `<div class="card">${media}${a.title?`<h3>${esc(a.title)}</h3>`:''}${a.text?`<p>${esc(a.text)}</p>`:''}${btn}</div>`}).join('');
const gal=C.gallery.length?`<div class="grid gg">${C.gallery.map(g=>`<div class="gi"><img src="${g}" alt="${esc(C.name)} photo" loading="lazy"></div>`).join('')}</div>`:'<p class="intro">Photos coming soon.</p>';
const dim=Math.max(0,Math.min(90,+C.heroDim||0))/100;
const heroStyle=C.heroImg?` style="background:linear-gradient(rgba(0,0,0,${dim}),rgba(0,0,0,${dim})),url('${C.heroImg}') center/cover no-repeat"`:'';
const showAch=C.achShow!=='no';
const opts=C.programs.map(p=>`<option value="${esc(p.ages)}">${esc(p.ages)} (${esc(p.name)})</option>`).join('');
$('#app').innerHTML=`
<header><div class="container navbar">
<a href="#home" class="logo">${logoHTML()}</a>
<nav><a href="#home">Home</a><a href="#about">About</a><a href="#programs">Programs</a><a href="#values">Values</a><a href="#gallery">Gallery</a>${showAch?`<a href="#achievements">${esc(C.achNav)}</a>`:''}<a href="#contact">Contact</a><a href="#register" class="nr">Register</a></nav>
</div></header>
<section class="hero" id="home"${heroStyle}><div class="hero-content">
<h1>${esc(C.h1a)}<br><span>${esc(C.h1b)}</span></h1><p>${esc(C.heroText)}</p>
<a href="#programs" class="btn">Explore Our Programs</a><a href="#register" class="btn btn-o">Join the Academy</a>
</div></section>
<section class="hl"><div class="container hl-grid">
<div><h3>⚽ Football</h3><p>Developing technical and tactical skills</p></div>
<div><h3>🏆 Excellence</h3><p>Building a winning mentality</p></div>
<div><h3>🤝 Teamwork</h3><p>Growing together on and off the pitch</p></div>
</div></section>
<section class="about" id="about"><div class="container"><h2>About <span>${esc(C.logoA+C.logoB)}</span></h2>${paras}</div></section>
<section class="programs" id="programs"><div class="container"><h2>Our <span>Programs</span></h2>
<p class="intro">Structured football development programs designed to nurture talent at every stage of a player's journey.</p><div class="grid pg">${prog}</div></div></section>
<section class="values" id="values"><div class="container"><h2>Our Core <span>Values</span></h2><div class="grid vg">${vals}</div></div></section>
<section class="gallery" id="gallery"><div class="container"><h2>Our <span>Gallery</span></h2>
<p class="intro">A glimpse into our training sessions, matches, tournaments, and life at the academy.</p>${gal}</div></section>
${showAch?`<section class="ach" id="achievements"><div class="container"><h2>${esc(C.achA)} <span>${esc(C.achB)}</span></h2>
${C.achIntro?`<p class="intro">${esc(C.achIntro)}</p>`:''}<div class="grid ag">${ach}</div></div></section>`:''}
<section class="contact" id="contact"><div class="container"><h2>Contact <span>Us</span></h2>
<p class="intro">Interested in joining ${esc(C.name)}? Get in touch with us today.</p>
<div class="ci"><p><strong>📍 Location:</strong> ${esc(C.location)}</p>
<p><strong>📞 Phone:</strong> <a href="tel:${esc(C.phone)}">${esc(C.phone)}</a></p>
<p><strong>💬 WhatsApp:</strong> <a href="https://wa.me/${esc(C.wa)}" target="_blank" rel="noopener noreferrer">Chat with us on WhatsApp</a></p></div>
<div class="cb"><a href="tel:${esc(C.phone)}" class="btn">Call Us</a><a href="https://wa.me/${esc(C.wa)}" class="btn btn-o" target="_blank" rel="noopener noreferrer">WhatsApp Us</a></div></div></section>
<section class="register" id="register"><div class="container"><h2>Join <span>${esc(C.logoA+C.logoB)}</span></h2>
<p class="intro">Fill in the form and it opens WhatsApp with your details ready to send to the academy.</p>
<form class="reg" id="regForm"><div class="fg">
<div><label for="pn">Player's Full Name *</label><input id="pn" required></div>
<div><label for="dob">Date of Birth *</label><input type="date" id="dob" required></div>
<div><label for="gd">Gender *</label><select id="gd" required><option value="">Select Gender</option><option>Male</option><option>Female</option></select></div>
<div><label for="ag">Age Group *</label><select id="ag" required><option value="">Select Age Group</option>${opts}</select></div>
<div><label for="gn">Parent / Guardian Name *</label><input id="gn" required></div>
<div><label for="ph">Parent / Guardian Phone *</label><input type="tel" id="ph" placeholder="07XXXXXXXX" required></div>
<div><label for="em">Email Address (Optional)</label><input type="email" id="em"></div>
<div><label for="ex">Previous Football Experience</label><select id="ex"><option value="">Select Experience</option><option>Beginner</option><option>Some experience</option><option>Experienced player</option></select></div>
<div class="full"><label for="ms">Additional Information</label><textarea id="ms" placeholder="Anything else you'd like us to know..."></textarea></div>
</div><button type="submit" class="btn">Send Registration on WhatsApp</button></form></div></section>
<footer><div class="container"><p>&copy; ${new Date().getFullYear()} <strong>${esc(C.name)}.</strong> All Rights Reserved.</p>
<p>${esc(C.h1a)} ${esc(C.h1b)}</p><p><a id="mgr">Manager login</a></p></div></footer>`;
}

/* Registration -> WhatsApp */
document.addEventListener('submit',e=>{
if(e.target.id!=='regForm')return;
e.preventDefault();
const v=i=>(document.getElementById(i).value||'-').trim();
const t=`New registration - ${C.name}\nPlayer: ${v('pn')}\nDate of birth: ${v('dob')}\nGender: ${v('gd')}\nAge group: ${v('ag')}\nParent/Guardian: ${v('gn')}\nPhone: ${v('ph')}\nEmail: ${v('em')}\nExperience: ${v('ex')}\nNotes: ${v('ms')}`;
window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent(t)}`,'_blank');
e.target.reset();
});

/* ---------- MANAGER PANEL ---------- */
let tab='brand';
const save=()=>{try{localStorage.setItem('topspot_site',JSON.stringify(C))}catch(e){alert('Browser storage is full. Remove a few photos, or download your site first.')}render()};
const F=(k,l,t)=>`<label>${l}</label>`+(t==='area'?`<textarea data-k="${k}" rows="7">${esc(C[k])}</textarea>`:`<input data-k="${k}" type="${t||'text'}" value="${esc(C[k])}">`);
const L=(k,fs,t)=>C[k].map((o,i)=>`<div class="it"><b>${t} ${i+1}</b><button class="a d" data-act="del" data-l="${k}" data-i="${i}">Delete</button>${fs.map(([f,lb])=>`<label>${lb}</label><input data-l="${k}" data-i="${i}" data-f="${f}" value="${esc(o[f])}">`).join('')}</div>`).join('')+`<button class="a p" data-act="add" data-l="${k}">+ Add ${t.toLowerCase()}</button>`;
const TABS={brand:'Logo & colour',text:'Text',programs:'Sessions & prices',gallery:'Photos',more:'Values',ach:'Achievements section',contact:'Contact',publish:'Publish'};
function adminView(){
let b='';
if(tab==='brand'){
const mode=C.logoMode||'text';
b=`<label>Logo style</label><select data-k="logoMode">
<option value="text"${mode==='text'?' selected':''}>Text only</option>
<option value="image"${mode==='image'?' selected':''}>Picture only (my own logo image)</option>
<option value="both"${mode==='both'?' selected':''}>Picture + text</option></select>
<p class="hint">Upload any logo image (PNG, JPG, SVG, GIF or WebP). A transparent PNG or SVG looks best on the dark header. Choose "Picture only" to show just the image.</p>
<label>Logo image</label><input type="file" accept="image/*" data-act="logo">${C.logo?`<div><img class="lp" src="${C.logo}" alt=""></div><button class="a d" data-act="nologo">Remove logo image</button>`:''}
<label>Logo picture height (<span id="lhv">${+C.logoH||44}</span>px)</label><input type="range" min="24" max="120" step="2" data-k="logoH" value="${+C.logoH||44}">`
+F('logoA','Logo text – white part')+F('logoB','Logo text – coloured part')+F('logoC','Logo text – after')+F('name','Full academy name')+`<label>Brand colour</label><input type="color" data-k="color" value="${esc(C.color)}">`;
}
if(tab==='text')b=`<label>Home page picture (shown behind the headline)</label><input type="file" accept="image/*" data-act="heroimg">${C.heroImg?`<div><img class="lp" style="max-height:90px" src="${C.heroImg}" alt=""></div><button class="a d" data-act="noheroimg">Remove picture</button>`:''}<label>Darken picture so the text stays readable (<span id="hdv">${+C.heroDim||0}</span>%)</label><input type="range" min="0" max="90" step="5" data-k="heroDim" value="${+C.heroDim||0}">`+F('h1a','Headline line 1')+F('h1b','Headline line 2 (coloured)')+F('heroText','Welcome message','area')+F('about','About text (leave a blank line between paragraphs)','area');
if(tab==='programs')b=`<p class="hint">Age groups here also fill the registration form's drop-down.</p>`+L('programs',[['ages','Age group (e.g. U7 – U9)'],['name','Programme name'],['desc','Description'],['sessions','Session days & times'],['price','Price (e.g. KES 3,000 / month)']],'Programme');
if(tab==='gallery')b=`<label>Add photos (you can pick several)</label><input type="file" accept="image/*" multiple data-act="photos"><div style="margin-top:10px">${C.gallery.map((g,i)=>`<span class="ph"><img src="${g}" alt=""><button data-act="rmphoto" data-i="${i}" title="Remove">×</button></span>`).join('')||'<p>No photos yet.</p>'}</div>`;
if(tab==='more')b=`<h3>Values</h3>`+L('values',[['title','Title'],['text','Text']],'Value');
if(tab==='ach'){
const n=C.achievements.length;
b=`<p class="hint">Use this section for anything you like: achievements, match results, news, testimonials, sponsors, coaches, events... Change the heading below and fill the cards with a photo or an emoji.</p>
<label>Show this section on the website?</label><select data-k="achShow"><option value="yes"${C.achShow!=='no'?' selected':''}>Yes, show it</option><option value="no"${C.achShow==='no'?' selected':''}>No, hide it</option></select>`
+F('achA','Heading – white part')+F('achB','Heading – coloured part')+F('achNav','Menu link name')+F('achIntro','Short intro under the heading (can be empty)','area')
+`<h3 style="margin-top:18px">Cards</h3>`
+C.achievements.map((o,i)=>`<div class="it"><b>Card ${i+1}</b>
<button class="a" data-act="up" data-i="${i}"${i===0?' disabled':''}>↑</button><button class="a" data-act="down" data-i="${i}"${i===n-1?' disabled':''}>↓</button><button class="a d" data-act="del" data-l="achievements" data-i="${i}">Delete</button>
${(()=>{const m=o.mode||(o.img?'photo':'symbol');const sel=(f,v,opts)=>`<select data-l="achievements" data-i="${i}" data-f="${f}">${opts.map(([k,t])=>`<option value="${k}"${v===k?' selected':''}>${t}</option>`).join('')}</select>`;
return `<label>Top of the card shows</label>${sel('mode',m,[['photo','A photo / image'],['symbol','An emoji or any symbol / letters'],['none','Nothing (text only)']])}`
+(m==='photo'?`<label>Choose image (any picture, logo, poster...)</label><input type="file" accept="image/*" data-act="achimg" data-i="${i}">${o.img?`<img class="ai" src="${o.img}" alt=""><button class="a d" data-act="noachimg" data-i="${i}">Remove image</button>`:''}<label>Image fit</label>${sel('fit',o.fit||'cover',[['cover','Fill the space (may crop)'],['contain','Show whole image (logos, posters)']])}`:'')
+(m==='symbol'?`<label>Emoji, symbol or short text (e.g. 🏆, 1st, 2025, ★)</label><input data-l="achievements" data-i="${i}" data-f="icon" value="${esc(o.icon)}">`:'')})()}
${[['title','Title (can be empty)'],['text','Text (can be empty)'],['btn','Button label (optional, e.g. Read more)'],['link','Button link (optional, https://...)']].map(([f,lb])=>`<label>${lb}</label><input data-l="achievements" data-i="${i}" data-f="${f}" value="${esc(o[f]||'')}">`).join('')}</div>`).join('')
+`<button class="a p" data-act="add" data-l="achievements">+ Add card</button>`;
}
if(tab==='contact')b=F('location','Location')+F('phone','Phone number (e.g. 0795469246)')+F('wa','WhatsApp number, international format, no + or spaces (e.g. 254795469246)')+`<p class="hint">Registrations are sent to this WhatsApp number.</p><label>New manager password</label><input id="npw" type="text" placeholder="Type a new password"><button class="a" data-act="setpw">Change password</button>`;
if(tab==='publish')b=`<p class="hint"><b>Important:</b> your edits are saved in <u>this browser only</u>. To make them live for everyone, click <b>Download updated website</b> and upload the downloaded <code>index.html</code> to your hosting, replacing the old one.</p><button class="a p" data-act="download">Download updated website</button><button class="a d" data-act="reset">Reset to original content</button>`;
$('#admin').innerHTML=`<h3>Manager panel</h3><button class="a" data-act="close">Close</button><div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${v}</button>`).join('')}</div>${b}`;
}
/* Resize images; keep transparency for logos (PNG) and keep SVG/GIF crisp where possible */
const shrink=(f,max,type)=>new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width||max,im.height||max)),c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.width||max)*s));c.height=Math.max(1,Math.round((im.height||max)*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL(type,.78))};im.onerror=()=>r(null);im.src=u});
const readURL=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)});
function login(){
const p=prompt('Manager password:');
if(p===null)return;
if(hash(p)!==C.pw){alert('Wrong password.');return}
adminView();$('#admin').classList.add('open');
}
document.addEventListener('click',async e=>{
const t=e.target;
if(t.id==='mgr'){login();return}
if(t.dataset.tab){tab=t.dataset.tab;adminView();return}
const a=t.dataset.act;if(!a||a==='logo'||a==='photos'||a==='achimg'||a==='heroimg')return;
const k=t.dataset.l,i=+t.dataset.i;
if(a==='close')$('#admin').classList.remove('open');
if(a==='del'&&confirm('Delete this item?')){C[k].splice(i,1);save();adminView()}
if(a==='add'){C[k].push(Object.assign({},NEW[k]));save();adminView()}
if(a==='up'&&i>0){const x=C.achievements;[x[i-1],x[i]]=[x[i],x[i-1]];save();adminView()}
if(a==='down'&&i<C.achievements.length-1){const x=C.achievements;[x[i+1],x[i]]=[x[i],x[i+1]];save();adminView()}
if(a==='noachimg'){C.achievements[i].img='';save();adminView()}
if(a==='noheroimg'){C.heroImg='';save();adminView()}
if(a==='nologo'){C.logo='';C.logoMode='text';save();adminView()}
if(a==='rmphoto'){C.gallery.splice(i,1);save();adminView()}
if(a==='setpw'){const v=$('#npw').value;if(v.length<4){alert('Use at least 4 characters.');return}C.pw=hash(v);save();alert('Password changed.')}
if(a==='reset'&&confirm('Remove all your edits from this browser and go back to the original content?')){localStorage.removeItem('topspot_site');C=Object.assign({},D,baked);render();adminView()}
if(a==='download'){
const d=document.documentElement.cloneNode(true);
d.querySelector('#app').innerHTML='';d.querySelector('#admin').innerHTML='';d.querySelector('#admin').className='';
d.querySelector('#cfg').textContent=JSON.stringify(C).replace(/</g,'\\u003c');
d.removeAttribute('style');
const l=document.createElement('a');
l.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}));
l.download='index.html';l.click();
}
});
document.addEventListener('input',e=>{
const d=e.target.dataset;
if(d.k){
C[d.k]=d.k==='logoH'?(+e.target.value||44):d.k==='heroDim'?(+e.target.value||0):e.target.value;
if(d.k==='heroDim'){const h=$('#hdv');if(h)h.textContent=C.heroDim}
if(d.k==='logoH'){const s=$('#lhv');if(s)s.textContent=C.logoH}
save();
}
else if(d.l&&d.f){C[d.l][+d.i][d.f]=e.target.value;save()}
});
document.addEventListener('change',async e=>{
const t=e.target,a=t.dataset.act;
if(a==='logo'&&t.files[0]){
const f=t.files[0];
/* SVG and GIF are kept as-is (sharp / animated); other images are resized and keep transparency as PNG */
const keep=/svg|gif/.test(f.type);
const r=keep?await readURL(f):await shrink(f,600,'image/png');
if(r){C.logo=r;if((C.logoMode||'text')==='text')C.logoMode='image';save();adminView()}
else alert('Sorry, that image could not be read. Try a PNG, JPG or SVG.');
}
if(a==='achimg'&&t.files[0]){const r=await shrink(t.files[0],900,'image/jpeg');if(r){C.achievements[+t.dataset.i].img=r;save();adminView()}}
if(a==='heroimg'&&t.files[0]){const r=await shrink(t.files[0],1600,'image/jpeg');if(r){C.heroImg=r;save();adminView()}}
if(a==='photos'){for(const f of t.files){const r=await shrink(f,1000,'image/jpeg');if(r)C.gallery.push(r)}save();adminView()}
if(t.dataset.f==='mode'&&t.dataset.l==='achievements')adminView();
});
render();
if(location.hash==='#manager')login();
</script>
</body>
</html>
